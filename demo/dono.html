<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17506e">

<title>Painel do dono · Clínica Dental</title>
<!--
  PAINEL DO DONO NO CELULAR — página feita para o polegar, não é o sistema inteiro.

  Arquivo à parte do index.html de propósito: o webui do desktop (index.html) não é
  tocado por nada daqui, e este arquivo não lê nada dele. Os dois são servidos pelo
  MESMO servidor.py (GET /mobile.html), usam o MESMO login (Bearer /api/login) e as
  MESMAS rotas — nada de endpoint novo além de /api/agenda, que o desktop ainda não
  tinha.

  As três telas são o que o dono confere de longe:
    HOJE ........ caixa do dia por moeda (BRL/USD/GS), recebimentos do dia e a agenda;
    PENDÊNCIAS .. quem ainda deve, por moeda, com o botão de WhatsApp já pronto;
    CONVERSAS ... quem está esperando atendente humano (aguardando_humano).
  Rodapé: estado da licença. Topo: botão de atualizar.

  A token vive no localStorage (o dono não reloga cada vez que abre; o desktop guarda
  a sessão dele do jeito dele, em outro arquivo). Tudo que vem do servidor entra na
  tela por esc() — nome de paciente é texto digitado por gente e não vira HTML.
-->
<style>
  :root{
    color-scheme:light;
    --clinic:#17506e;
    --clinic-dark:#123c53;
    --clinic-soft:#e7eff4;
    --bg:#f2f2f7;
    --card:#ffffff;
    --surface:#eeeef3;
    --border:#c9c9d0;
    --sep:rgba(60,60,67,.20);
    --text:#1c1c1e;
    --muted:#4a4a52;
    --green:#15803d;
    --green-soft:#dcfce7;
    --amber:#8a4b06;
    --amber-soft:#fdf0c8;
    --red:#b91c1c;
    --red-soft:#fee2e2;
    --wa:#1da851;
    --sombra:0 1px 2px rgba(15,23,42,.05), 0 10px 26px -20px rgba(15,23,42,.45);
    --topo-h:56px;
    --abas-h:68px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:17px;
    line-height:1.4;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  :focus-visible{outline:3px solid var(--clinic);outline-offset:2px;border-radius:8px}
  .some{display:none !important}

  /* ---------- topo (barra fina, some atrás do conteúdo que rola) ---------- */
  .topo{
    position:fixed;top:0;left:0;right:0;z-index:20;
    display:flex;align-items:center;gap:10px;
    min-height:calc(var(--topo-h) + env(safe-area-inset-top));
    padding:env(safe-area-inset-top) 14px 0;
    background:rgba(242,242,247,.86);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    backdrop-filter:saturate(180%) blur(20px);
    border-bottom:1px solid var(--sep);
  }
  .topo .txt{flex:1;min-width:0}
  .topo .sub{font-size:16px;font-weight:500;color:var(--muted);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #btnAtualizar{
    min-height:44px;border:0;background:transparent;color:var(--clinic);
    font-size:18px;font-weight:600;padding:0 6px;border-radius:10px;
  }
  #btnAtualizar:active{opacity:.5}
  #btnAtualizar[disabled]{opacity:.45}

  /* ---------- aviso de rede / licença ---------- */
  #avisoRede{
    margin:0 16px 12px;padding:14px;border-radius:14px;font-size:16px;line-height:1.35;
    background:var(--amber-soft);color:var(--amber);
  }

  /* ---------- conteúdo ---------- */
  main{
    padding:calc(var(--topo-h) + env(safe-area-inset-top) + 4px) 0
            calc(var(--abas-h) + env(safe-area-inset-bottom) + 10px);
  }
  .titulo-grande{
    font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.1;
    margin:14px 16px 16px;
  }
  .tela{display:none;padding:0 16px}
  .tela.ativa{display:block}
  .cartao{
    background:var(--card);border-radius:18px;box-shadow:var(--sombra);
    padding:4px 16px 6px;margin-bottom:14px;
  }
  .cartao > h2{
    font-size:20px;font-weight:700;letter-spacing:-.01em;
    display:flex;align-items:baseline;gap:10px;padding:14px 0 10px;
  }
  .cartao > h2 .quando{margin-left:auto;font-size:16px;font-weight:500;color:var(--muted)}
  .vazio{color:var(--muted);font-size:17px;padding:12px 0 20px}
  .erro{color:var(--red);font-size:16px;background:var(--red-soft);border-radius:12px;padding:14px}

  /* ---------- dinheiro ---------- */
  .moeda-linha{
    display:flex;align-items:center;gap:12px;min-height:62px;padding:12px 0;
    border-bottom:1px solid var(--sep);
  }
  .moeda-linha:last-child{border-bottom:0}
  .moeda-linha .nome{color:var(--muted);font-size:17px}
  .moeda-linha .valor{
    margin-left:auto;font-size:26px;font-weight:700;letter-spacing:-.01em;
    font-variant-numeric:tabular-nums;
  }
  .moeda-linha.zero .valor{color:var(--muted);font-weight:600}
  .recebido{
    display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;
    padding:16px 0 14px;border-top:1px solid var(--sep);
  }
  .recebido .rotulo{font-size:17px;color:var(--muted)}
  .recebido .total{
    font-size:23px;font-weight:700;color:var(--green);
    font-variant-numeric:tabular-nums;margin-left:auto;
  }
  .recebido .aviso{font-size:16px;color:var(--amber);flex-basis:100%}

  /* ---------- linhas de gente (agenda, pendência, conversa) ---------- */
  .linha{
    display:flex;gap:12px;align-items:center;min-height:70px;padding:14px 0;
    border-bottom:1px solid var(--sep);
  }
  .linha:last-child{border-bottom:0}
  .linha .info{flex:1;min-width:0}
  .linha .quem{
    display:block;font-weight:600;font-size:21px;letter-spacing:-.01em;overflow-wrap:anywhere;
    line-height:1.25;
  }
  .linha .detalhe{display:block;font-size:16px;color:var(--muted);overflow-wrap:anywhere;margin-top:3px}
  .linha .hora{
    font-size:22px;font-weight:700;color:var(--clinic-dark);min-width:66px;
    font-variant-numeric:tabular-nums;
  }
  .linha .deve{font-size:20px;font-weight:700;color:var(--red);text-align:right;line-height:1.2}
  .linha .deve small{display:block;font-size:15px;font-weight:600;color:var(--muted)}
  .btn-wa{
    min-height:48px;padding:0 16px;border-radius:14px;border:0;
    background:var(--wa);color:#fff;font-weight:600;font-size:17px;
    text-decoration:none;display:inline-flex;align-items:center;white-space:nowrap;
  }
  .btn-wa:active{opacity:.7}
  .btn-wa.mudo{background:var(--surface);color:var(--muted);font-weight:600;font-size:15px;padding:0 12px}
  .chip{
    display:inline-block;font-size:14px;font-weight:600;padding:3px 10px;border-radius:999px;
    background:var(--clinic-soft);color:var(--clinic-dark);
  }
  .chip.espera{background:var(--amber-soft);color:var(--amber)}
  .chip.ok{background:var(--green-soft);color:var(--green)}

  /* ---------- abas (barra de app no rodapé) ---------- */
  #abas{
    position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;
    height:calc(var(--abas-h) + env(safe-area-inset-bottom));
    padding-bottom:env(safe-area-inset-bottom);
    background:rgba(249,249,251,.9);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    backdrop-filter:saturate(180%) blur(20px);
    border-top:1px solid var(--sep);
  }
  #abas button{
    flex:1;border:0;background:transparent;color:var(--muted);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    font-size:13px;font-weight:600;min-height:52px;padding:0;
  }
  #abas button .icone{
    width:29px;height:29px;display:block;fill:none;stroke:currentColor;
    stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;
  }
  #abas button.ativa{color:var(--clinic)}
  #abas button.ativa .icone{stroke-width:2.4}
  #abas button:active{opacity:.6}
  .badge{
    display:inline-block;min-width:19px;height:19px;line-height:19px;padding:0 5px;
    border-radius:999px;background:var(--red);color:#fff;font-size:12px;font-weight:700;
    vertical-align:1px;margin-left:4px;text-align:center;
  }
  .badge.ambar{background:var(--amber)}

  /* ---------- rodapé (licença) ---------- */
  .rodape{
    display:flex;align-items:center;gap:10px;margin:4px 16px 10px;padding:14px 16px;
    background:var(--card);border-radius:18px;box-shadow:var(--sombra);
    font-size:16px;color:var(--muted);
  }
  .rodape .pino{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
  .rodape.ok .pino{background:var(--green)}
  .rodape.ruim .pino{background:var(--red)}
  .rodape .texto{flex:1}
  #btnSair{
    border:0;background:transparent;color:var(--red);font-size:18px;font-weight:600;
    min-height:44px;padding:0 4px;border-radius:10px;
  }

  /* ---------- login ---------- */
  #loginOverlay{
    position:fixed;inset:0;z-index:40;background:var(--bg);
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .login-cartao{
    background:var(--card);border-radius:22px;width:100%;max-width:390px;
    padding:28px 22px;box-shadow:0 24px 60px -24px rgba(15,23,42,.45);
  }
  .login-cartao h1{font-size:27px;font-weight:700;letter-spacing:-.02em;margin-bottom:6px}
  .login-cartao p{font-size:16px;color:var(--muted);margin-bottom:22px;line-height:1.35}
  .campo{margin-bottom:16px}
  .campo label{display:block;font-size:16px;font-weight:600;color:var(--muted);margin-bottom:6px}
  .campo input{
    width:100%;min-height:54px;font-size:17px;padding:0 14px;border-radius:14px;
    border:1px solid var(--border);background:#fff;color:var(--text);
  }
  #loginAviso{font-size:16px;color:var(--red);min-height:20px;margin-bottom:10px}
  #btnLogin{
    width:100%;min-height:56px;border:0;border-radius:16px;color:#fff;font-size:19px;
    font-weight:600;background:var(--clinic);
  }
  #btnLogin:active{opacity:.85}
  #btnLogin[disabled]{opacity:.6}
  .login-pe{font-size:15px;color:var(--muted);margin-top:18px;text-align:center}
</style><body>

<header class="topo">

</div>

<script>
  'use strict';
  /* ============================================================
     CAMADA DE DADOS — as mesmas rotas do desktop, o mesmo token.
     A diferença é só onde o token mora: aqui no localStorage, para o
     dono não relogar toda vez que abre o celular.
     ============================================================ */
  const TOKEN_KEY = 'dental.painel.token';
  const USUARIO_KEY = 'dental.painel.usuario';
  const LIMITE_CONVERSAS = 20;          // conversas aguardando humano na tela
  const MOEDAS = ['BRL','USD','GS'];
  const precos = {BRL:{simbolo:'R$',dec:2}, USD:{simbolo:'US$',dec:2}, GS:{simbolo:'Gs',dec:0}};
  const nomesMoeda = {BRL:'Reais', USD:'Dólares', GS:'Guaranis'};
  const LIMITE_PARALELO = 6;            // fichas puxadas de uma vez nas pendências

  function token(){
    try{ return localStorage.getItem(TOKEN_KEY) || ''; }catch(_){ return ''; }
  }

  function guardarToken(t, u){
    try{
      if(t){ localStorage.setItem(TOKEN_KEY, t); } else { localStorage.removeItem(TOKEN_KEY); }
      if(u){ localStorage.setItem(USUARIO_KEY, u); } else { localStorage.removeItem(USUARIO_KEY); }
    }catch(_){ }
  }

  function usuarioDaSessao(){
    try{ return localStorage.getItem(USUARIO_KEY) || ''; }catch(_){ return ''; }
  }

  /* ===========================================================================
     MODO APRESENTAÇÃO (19/10/2026) — o servidor mora AQUI dentro.
     Esta é a MESMA tela do sistema (v3.6), mas sem depender do servidor da
     clínica: todas as chamadas /api/... são respondidas por este bloco, com
     dados de exemplo. Serve para mostrar ao cliente. Nada é gravado em disco.

    const agora = () => {
      const d = new Date(); const p = n => String(n).padStart(2, '0');
      return p(d.getHours()) + ':' + p(d.getMinutes());
    };
    const USUARIOS = {
      'cesar':    {senha: 'demo-Dental-2026', nome: 'Dr. Carlos',  papel: 'admin'},

    };
    let proximoId = 7;
    const fichas = [
      {id:1, nome:'Ana Souza',      tel:'(48) 99123-4567', sexo:'F', idade:34, idioma:'PT', moeda:'BRL', cpf:'123.456.789-00', comoConheceu:'Instagram', orcamento:1800, pago:1500, pendente:300, dentes:{'26':'tratar','36':'ok'}},
      {id:2, nome:'João Pereira',   tel:'(48) 98812-3344', sexo:'M', idade:52, idioma:'PT', moeda:'BRL', cpf:'234.567.890-11', comoConheceu:'Indicação', orcamento:2400, pago:2400, pendente:0, dentes:{'11':'ok'}},
      {id:3, nome:'Maria Lima',     tel:'(48) 99655-1122', sexo:'F', idade:41, idioma:'PT', moeda:'BRL', cpf:'345.678.901-22', comoConheceu:'Google', orcamento:900, pago:0, pendente:900, dentes:{}},
      {id:4, nome:'Carlos Oliveira',tel:'+595 981 222 333', sexo:'M', idade:47, idioma:'ES', moeda:'GS', ruc:'80012345-6', comoConheceu:'WhatsApp', orcamento:1500000, pago:450000, pendente:1050000, dentes:{'46':'problema'}},

    ];
    const orcamentos = {
      1:[{descricao:'Limpeza + flúor', valor:250, moeda:'BRL', dente:'—'},
         {descricao:'Restauração no 26', valor:1550, moeda:'BRL', dente:'26'}],
      2:[{descricao:'Canal no 11', valor:2400, moeda:'BRL', dente:'11'}],
      3:[{descricao:'Avaliação + clareamento', valor:900, moeda:'BRL', dente:'—'}],

      6:[{descricao:'Prótese provisória', valor:600, moeda:'USD', dente:'—'}]
    };
    const evolucoes = {
      1:[{data:isoDia(-3), procedimento:'Limpeza', profissional:'Dr. Carlos', valor:250, moeda:'BRL', observacoes:'Sensibilidade leve no 26; orientada higiene com escova macia.'}],
      2:[{data:isoDia(-9), procedimento:'Canal no 11', profissional:'Dra. Mariana', valor:2400, moeda:'BRL', observacoes:'Canal concluído em sessão única.'}],
      4:[{data:isoDia(-15), procedimento:'Implante — 1ª parcela', profissional:'Dr. Carlos', valor:450000, moeda:'GS', observacoes:'Paciente do PY, pagou em guaraní.'}]
    };
    const pagamentos = [
      {nome:'Ana Souza',       forma:'Pix',           moeda:'BRL', valor:250,   data:isoDia(0) + ' 08:30'},
      {nome:'João Pereira',    forma:'Cartão',        moeda:'BRL', valor:250,   data:isoDia(0) + ' 09:40'},

    };
    const agenda = () => ([

      {hora:'11:00', paciente:'Maria Lima',      tel:'5548996551122', procedimento:'Clareamento',       status:'agendada'},
      {hora:'12:15', paciente:'Carlos Oliveira', tel:'595981222333',  procedimento:'Implante — 2ª fase', status:'confirmada'},
      {hora:'16:00', paciente:'Fernanda Costa',  tel:'5548997448899', procedimento:'Restauração',       status:'agendada'}
    ]);
    const configBot = {
      modo: 'auto',
      perfil: 'padrao',
      boas_vindas: 'Olá! Aqui é a recepção da Clínica Dr. Carlos & Dra. Mariana. Como posso ajudar?',
      horario: {inicio: '08:00', fim: '18:00'},

    return {fichas:fichas, orcamentos:orcamentos, evolucoes:evolucoes, pagamentos:pagamentos,
            caixa:caixa, agenda:agenda, configBot:configBot, USUARIOS:USUARIOS, agora:agora, isoDia:isoDia,
            proximoId: () => proximoId++};
  })();

  function SERVICO_LOCAL(caminho, config){
    const responder = (dados, status) => Promise.resolve({
      ok: (status || 200) < 400, status: status || 200,
      json: () => Promise.resolve(dados)
    });
    const metodo = (config && config.method) || 'GET';
    let corpo = {};
    try{ corpo = config && config.body ? JSON.parse(config.body) : {}; }catch(_){ corpo = {}; }
    const rotaCompleta = String(caminho).replace(/^https?:\/\/[^/]+/, '');
    const rota = rotaCompleta.split('?')[0];
    const query = new URLSearchParams(rotaCompleta.split('?')[1] || '');
    const mId = rota.match(/^\/api\/pacientes\/(\d+)(?:\/([a-z]+))?$/);

    if(rota === '/api/licenca') return responder({ativa: true, ate: '2099-12-31'});
    if(rota === '/api/login' && metodo === 'POST'){
      const u = _DEMO.USUARIOS[String(corpo.login || '').toLowerCase().trim()];
      if(!u || u.senha !== corpo.senha) return responder({erro: 'usuário ou senha incorretos'}, 401);
      return responder({token: 'demo-' + Date.now(), usuario: u.nome, papel: u.papel});
    }
    if(rota === '/api/logout') return responder({ok: true});
    if(rota === '/api/pacientes' && metodo === 'GET')
      return responder(_DEMO.fichas.map(f => ({id:f.id, nome:f.nome, tel:f.tel})));
    if(rota === '/api/pacientes' && metodo === 'POST'){
      const f = {id:_DEMO.proximoId(), nome:corpo.nome || 'Paciente novo', tel:corpo.telefone || '',
                 idioma:corpo.idioma || 'PT', moeda:corpo.moeda || 'BRL',
                 cpf:corpo.cpf || '', ruc:corpo.ruc || '', orcamento:0, pago:0, pendente:0, dentes:{}};
      _DEMO.fichas.push(f);
      return responder(f, 201);
    }
    if(mId){
      const id = Number(mId[1]); const sub = mId[2];
      const ficha = _DEMO.fichas.find(f => f.id === id);
      if(!ficha) return responder({erro: 'paciente não encontrado'}, 404);
      if(!sub && metodo === 'GET'){
        const saldoPorMoeda = {};
        if(Number(ficha.pendente) > 0) saldoPorMoeda[ficha.moeda || 'BRL'] =
          {pendente: Number(ficha.pendente), pago: Number(ficha.pago) || 0};
        return responder(Object.assign({saldoPorMoeda: saldoPorMoeda}, ficha));
      }
      if(sub === 'financeiro' && metodo === 'GET') return responder({orcamentos: _DEMO.orcamentos[id] || []});
      if(sub === 'evolucoes' && metodo === 'GET') return responder(_DEMO.evolucoes[id] || []);
      if(sub === 'exames' && metodo === 'GET') return responder([]);
      if(sub === 'dentes' && metodo === 'POST'){
        ficha.dentes = Object.assign({}, ficha.dentes, {[corpo.dente]: corpo.estado});
        return responder({ok: true, dentes: ficha.dentes});
      }
      if(metodo === 'POST' || metodo === 'PUT'){
        if(sub === 'evolucoes'){ (_DEMO.evolucoes[id] = _DEMO.evolucoes[id] || []).unshift(
          {data:corpo.data || _DEMO.isoDia(0), procedimento:corpo.servico || corpo.procedimento || 'Atendimento',
           profissional:corpo.profissional || 'Dr. Carlos', valor:Number(corpo.valor) || 0,
           moeda:ficha.moeda, observacoes:corpo.descricao || ''}); }
        if(sub === 'orcamentos'){ (_DEMO.orcamentos[id] = _DEMO.orcamentos[id] || []).push(
          {descricao:corpo.descricao || 'Procedimento', valor:Number(corpo.valor) || 0,
           moeda:corpo.moeda || ficha.moeda, dente:corpo.dente || '—'}); }
        if(sub === 'pagamentos'){
          const val = Number(corpo.valor) || 0;
          _DEMO.pagamentos.unshift({nome:ficha.nome, forma:corpo.forma || 'Pix',
            moeda:corpo.moeda || ficha.moeda, valor:val, data:_DEMO.isoDia(0) + ' ' + _DEMO.agora()});
          ficha.pago = (Number(ficha.pago) || 0) + val;
          ficha.pendente = Math.max(0, (Number(ficha.orcamento) || 0) - ficha.pago);
        }
        return responder({ok: true});
      }
    }
    if(rota === '/api/conversas') return responder([]);
    if(rota.indexOf('/api/conversas/') === 0) return responder({ok: true});
    if(rota === '/api/bot/config'){
      if(metodo === 'PUT'){
        Object.assign(_DEMO.configBot, corpo || {});
        return responder(_DEMO.configBot);
      }
      return responder(_DEMO.configBot);
    }
    if(rota === '/api/pagamentos'){
      const de = query.get('de');
      if(de && /^\d{4}-\d{2}-\d{2}$/.test(de))
        return responder(_DEMO.pagamentos.filter(p => p.data.slice(0,10) === de));
      return responder(_DEMO.pagamentos);
    }
    if(rota === '/api/caixa') return responder(_DEMO.caixa());
    if(rota === '/api/agenda') return responder(_DEMO.agenda());
    return responder({erro: 'rota de demonstração não existe: ' + rota}, 404);
  }

  async function api(caminho, opcoes){
    opcoes = opcoes || {};
    const cabecalhos = Object.assign({}, opcoes.cabecalhos || {});
    if(!opcoes.semToken && token()) cabecalhos['Authorization'] = 'Bearer ' + token();
    const config = {method: opcoes.metodo || 'GET', headers: cabecalhos};
    if(opcoes.corpo !== undefined){
      cabecalhos['Content-Type'] = 'application/json';
      config.body = JSON.stringify(opcoes.corpo);
    }
    let resposta;
    try{
      resposta = await SERVICO_LOCAL(caminho, config);
    }catch(_){
      avisoRede('Sem conexão com o servidor da clínica — os números podem estar velhos.');
      const erro = new Error('sem conexão com o servidor da clínica');
      erro.rede = true;
      throw erro;
    }
    let dados = null;
    try{ dados = await resposta.json(); }catch(_){ dados = null; }
    if(resposta.ok){ avisoRede(''); return dados; }
    const mensagem = (dados && dados.erro) || ('o servidor respondeu ' + resposta.status);
    const erro = new Error(mensagem);
    erro.status = resposta.status;
    if(resposta.status === 401 && !opcoes.semToken){
      pedirLogin(mensagem);                     // sessão velha: volta para o login
    }else if(resposta.status === 503){
      avisoRede(mensagem);                      // licença: o rodapé explica o resto
      mostrarLicenca(dados && dados.licenca);
    }
    throw erro;
  }

  /* ============================================================
     CONTAS PURAS (o que o teste mede sem navegador)
     ============================================================ */

  /* 'AAAA-MM-DD' do relógio do aparelho — o mesmo dia que o servidor devolve sem
     ?data=; o celular do dono costuma estar no fuso da clínica. */
  function isoDia(off){
    const d = new Date();
    d.setHours(12,0,0,0);
    d.setDate(d.getDate() + (off || 0));
    const p = n => String(n).padStart(2,'0');
    return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
  }

  function dataLonga(dia){
    const partes = String(dia || '').split('-');
    if(partes.length !== 3) return dia || '';
    const d = new Date(Number(partes[0]), Number(partes[1])-1, Number(partes[2]), 12, 0, 0, 0);
    return d.toLocaleDateString('pt-BR', {weekday:'long', day:'numeric', month:'long'});
  }

  function fmtMoeda(v, moeda){
    const p = precos[moeda] || precos.BRL;
    return p.simbolo + ' ' + (Number(v) || 0).toLocaleString('pt-BR',
      {minimumFractionDigits:p.dec, maximumFractionDigits:p.dec});
  }

  /* Só dígitos: é o que o wa.me aceita. */
  function digitos(tel){
    return String(tel == null ? '' : tel).replace(/\D/g, '');
  }

  /* Link do WhatsApp. Número curto (10 ou 11 dígitos) é brasileiro sem o 55; já
     vem com o DDI quem foi cadastrado com ele (+55, +595 do Paraguai). Sem número
     não existe link — a tela mostra o botão mudo em vez de um link quebrado. */
  function waLink(tel, texto){
    const d = digitos(tel);
    if(!d) return '';
    const numero = d.length <= 11 ? '55' + d : d;
    return 'https://wa.me/' + numero + (texto ? '?text=' + encodeURIComponent(texto) : '');
  }

  /* O que o paciente deve, MOEDA POR MOEDA (saldoPorMoeda do /api/pacientes/<id>):
     somar real com guarani daria um número sem sentido. */
  function pendentesDoResumo(resumo){
    const saldo = (resumo && resumo.saldoPorMoeda) || {};
    return MOEDAS.filter(m => saldo[m] && Number(saldo[m].pendente) > 0)
      .map(m => ({moeda:m, valor:Number(saldo[m].pendente)}));
  }

  /* Recebimentos do dia (linhas de /api/pagamentos?de=hoje&ate=hoje) somados em
     reais. Pagamento de outra moeda sem cotação (nem gravada nele, nem a do dia)
     some do total — e o total sai nulo com o motivo, em vez de somar 1:1 calado. */
  function totalDoDia(pagamentos, cotacao){
    const lista = Array.isArray(pagamentos) ? pagamentos : [];
    const taxas = cotacao || {};
    const faltando = [];
    let reais = 0;
    for(const p of lista){
      const moeda = precos[p && p.moeda] ? p.moeda : 'BRL';
      const gravada = Number(p && p.cotacao) || 0;
      const taxa = gravada || Number(taxas[moeda]) || 0;
      if(moeda !== 'BRL' && !taxa){
        if(faltando.indexOf(moeda) < 0) faltando.push(moeda);
        continue;
      }
      reais += Number((p && p.valor) || 0) * (taxa || 1);
    }
    return {
      recebimentos: lista.length,
      reais: faltando.length ? null : Math.round(reais * 100) / 100,
      faltando: faltando,
    };
  }

  /* A fila humana, UMA linha por paciente (a mensagem mais nova de cada um): o
     /api/conversas vem do mais novo para o mais antigo, com aguardando_humano só
     nas mensagens trocadas desde o pedido de atendente. */
  function aguardandoHumano(conversas, limite){
    const tela = [];
    const vistos = {};
    for(const c of (Array.isArray(conversas) ? conversas : [])){
      if(!c || !c.aguardando_humano) continue;
      const chave = c.paciente_id == null ? 'msg:' + c.id : 'pac:' + c.paciente_id;
      if(vistos[chave]) continue;
      vistos[chave] = true;
      tela.push(c);
      if(tela.length >= (limite || LIMITE_CONVERSAS)) break;
    }
    return tela;
  }

  /* O rodapé: licença ativa (com os dias que sobram) ou o motivo de estar parada. */
  function textoLicenca(lic){
    if(!lic) return {texto:'licença: sem resposta do servidor', tom:'aviso'};
    if(lic.ativa){
      const dias = Number(lic.dias_restantes);
      const resta = isFinite(dias) && dias > 0 ? ' · ' + Math.floor(dias) + 'd restantes' : '';
      return {texto:'licença ativa' + resta, tom:'ok'};
    }
    const motivos = {expirada:'expirada', nunca_verificada:'nunca verificada',
                     resposta_invalida:'resposta inválida', resposta_nao_assinada:'resposta não assinada'};
    const motivo = motivos[lic.motivo] || lic.motivo || 'inativa';
    return {texto:'licença ' + motivo + ' — fale com o suporte', tom:'ruim'};
  }

  /* ============================================================
     TELAS (HTML em texto — testável sem navegador, escapado sempre)
     ============================================================ */
  function esc(v){
    return String(v == null ? '' : v).replace(/[&<>"']/g,
      c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function htmlMoedas(caixa){
    const moedas = (caixa && caixa.moedas) || {};
    return MOEDAS.map(m => {
      const valor = Number((moedas[m] || {}).hoje || 0);
      return '<div class="moeda-linha' + (valor ? '' : ' zero') + '">'
        + '<span class="nome">' + nomesMoeda[m] + '</span>'
        + '<span class="valor">' + esc(fmtMoeda(valor, m)) + '</span>'
        + '</div>';
    }).join('');
  }

  function htmlRecebido(pagamentos, cotacao){
    const total = totalDoDia(pagamentos, cotacao);
    let html = '<span class="rotulo">' + total.recebimentos
      + (total.recebimentos === 1 ? ' recebimento hoje' : ' recebimentos hoje') + '</span>';
    if(total.reais === null){
      html += '<span class="total">R$ —</span>'
        + '<span class="aviso">sem cotação de ' + esc(total.faltando.join(', '))
        + ' — total não somado</span>';
    }else{
      html += '<span class="total">' + esc(fmtMoeda(total.reais, 'BRL')) + '</span>';
    }
    return html;
  }

  function htmlAgenda(itens){
    if(!itens || !itens.length){
      return '<div class="vazio">Nenhuma consulta marcada para hoje.</div>';
    }
    return itens.map(a => {
      const nome = a.paciente || 'Paciente removido';
      const procedimento = a.procedimento ? esc(a.procedimento) : 'Consulta';
      const link = waLink(a.tel, 'Olá ' + nome + ', aqui é da clínica — confirmando sua consulta de hoje.');
      const botao = link
        ? '<a class="btn-wa" href="' + esc(link) + '" target="_blank" rel="noopener">WhatsApp</a>'
        : '<span class="btn-wa mudo">sem telefone</span>';
      const situacao = a.status === 'confirmada'
        ? '<span class="chip ok">confirmada</span>' : '<span class="chip">agendada</span>';
      return '<div class="linha">'
        + '<span class="hora">' + esc(a.hora || '--:--') + '</span>'
        + '<span class="info"><span class="quem">' + esc(nome) + '</span>'
        + '<span class="detalhe">' + procedimento + ' · ' + situacao + '</span></span>'
        + botao + '</div>';
    }).join('');
  }

  function htmlPendencias(pacientes){
    if(!pacientes || !pacientes.length){
      return '<div class="vazio">Ninguém com saldo em aberto.</div>';
    }
    return pacientes.map(p => {
      const deves = p.pendentes.map(d => '<span class="deve">' + esc(fmtMoeda(d.valor, d.moeda))
        + '<small>' + esc(nomesMoeda[d.moeda]) + '</small></span>').join('');
      const link = waLink(p.tel, 'Olá ' + p.nome + ', aqui é da clínica — sobre o valor em aberto do seu tratamento.');
      const botao = link
        ? '<a class="btn-wa" href="' + esc(link) + '" target="_blank" rel="noopener">WhatsApp</a>'
        : '<span class="btn-wa mudo">sem telefone</span>';
      return '<div class="linha">'
        + '<span class="info"><span class="quem">' + esc(p.nome) + '</span>'
        + '<span class="detalhe">saldo em aberto</span></span>'
        + deves + botao + '</div>';
    }).join('');
  }

  function htmlConversas(itens){
    if(!itens || !itens.length){
      return '<div class="vazio">Ninguém esperando atendente agora.</div>';
    }
    return itens.map(c => {
      const nome = c.paciente || 'Número não identificado';
      const quando = String(c.data || '').replace('T', ' ').slice(0, 16);
      const texto = String(c.texto || '').slice(0, 140);
      const link = waLink(c.tel, '');
      const botao = link
        ? '<a class="btn-wa" href="' + esc(link) + '" target="_blank" rel="noopener">Responder</a>'
        : '<span class="btn-wa mudo">sem telefone</span>';
      return '<div class="linha">'
        + '<span class="info"><span class="quem">' + esc(nome) + ' <span class="chip espera">aguardando</span></span>'
        + '<span class="detalhe">' + esc(quando) + ' · ' + esc(texto) + '</span></span>'
        + botao + '</div>';
    }).join('');
  }

  /* ============================================================
     COLAGEM NA TELA
     ============================================================ */
  function el(id){ return document.getElementById(id); }

  function avisoRede(texto){
    const caixa = el('avisoRede');
    if(!caixa) return;
    caixa.textContent = texto || '';
    caixa.classList.toggle('some', !texto);
  }

  function mostrarLicenca(lic){
    const estado = textoLicenca(lic);
    const rodape = el('rodape');
    rodape.classList.toggle('ok', estado.tom === 'ok');
    rodape.classList.toggle('ruim', estado.tom === 'ruim');
    el('licenca').textContent = estado.texto;
    el('loginLicenca').textContent = lic && lic.ativa
      ? 'Painel do dono · ' + (usuarioDaSessao() || 'clínica') : estado.texto;
  }

  function pedirLogin(mensagem){
    guardarToken('', '');
    el('app').classList.add('some');
    el('abas').classList.add('some');
    el('loginOverlay').classList.remove('some');
    el('loginAviso').textContent = mensagem || '';
    el('btnLogin').disabled = false;
    el('btnLogin').textContent = 'Entrar';
    el('loginSenha').value = '';
    if(!el('loginUser').value) el('loginUser').value = usuarioDaSessao();
  }

  function entrarNaTela(usuario){
    el('loginOverlay').classList.add('some');
    el('app').classList.remove('some');
    el('abas').classList.remove('some');
    el('loginAviso').textContent = '';
  }

  function trocarTela(nome){
    document.querySelectorAll('.tela').forEach(s => s.classList.toggle('ativa', s.id === 'tela-' + nome));
    document.querySelectorAll('#abas button').forEach(b => b.classList.toggle('ativa', b.dataset.tela === nome));
    const titulos = {hoje:'Hoje', pendencias:'Pendências', conversas:'Conversas'};
    el('topoTitulo').textContent = titulos[nome] || 'Hoje';
    if(!trocado[nome]) carregar(nome);
  }

  /* ============================================================
     CARREGAR — cada bloco cai sozinho (um 403 de setor não apaga os outros)
     ============================================================ */
  let trocado = {};
  let ocupado = false;

  function bloco(id, html){
    el(id).innerHTML = html;
  }

  function blocoErro(id, erro){
    bloco(id, '<div class="erro">' + esc(erro && erro.message ? erro.message : erro) + '</div>');
  }

  async function carregarHoje(dia){
    const caixa = await api('/api/caixa');                        // setor: dinheiro
    bloco('caixaMoedas', htmlMoedas(caixa));
    el('caixaDia').textContent = dataLonga(caixa && caixa.dia ? caixa.dia : dia);
    const pagamentos = await api('/api/pagamentos?de=' + dia + '&ate=' + dia);
    bloco('recebidoDia', htmlRecebido(pagamentos, (caixa && caixa.cotacao) || {}));
  }

  async function carregarAgenda(dia){
    const agenda = await api('/api/agenda?data=' + dia);          // setor: prontuario
    el('agendaQtd').textContent = agenda.length
      ? agenda.length + (agenda.length === 1 ? ' consulta' : ' consultas') : 'dia livre';
    bloco('agendaLista', htmlAgenda(agenda));
  }

  /* Ficha por ficha: é o /api/pacientes/<id> que diz o saldo por moeda. Vai de
     poucas em poucas para não abrir 200 conexões num consultório grande. */
  async function carregarPendencias(){
    const pacientes = await api('/api/pacientes');
    const fichas = [];
    for(let i = 0; i < pacientes.length; i += LIMITE_PARALELO){
      const leva = pacientes.slice(i, i + LIMITE_PARALELO);
      const resumos = await Promise.all(leva.map(p => api('/api/pacientes/' + p.id)
        .catch(() => null)));
      resumos.forEach((resumo, k) => {
        const pendentes = pendentesDoResumo(resumo);
        if(pendentes.length){
          fichas.push({nome: (resumo && resumo.nome) || leva[k].nome,
                       tel: (resumo && resumo.tel) || leva[k].tel, pendentes: pendentes});
        }
      });
    }
    el('pendQtd').textContent = fichas.length ? fichas.length + ' em aberto' : 'nada em aberto';
    bloco('pendLista', htmlPendencias(fichas));
    const badge = el('badgePend');
    badge.textContent = String(fichas.length);
    badge.classList.toggle('some', !fichas.length);
  }

  async function carregarConversas(){
    const [conversas, pacientes] = await Promise.all([
      api('/api/conversas'),                                       // setor: atendimento
      api('/api/pacientes').catch(() => []),                       // o telefone do "Responder"
    ]);
    const telefones = {};
    (pacientes || []).forEach(p => { telefones[p.id] = p.tel; });
    const fila = aguardandoHumano(conversas, LIMITE_CONVERSAS)
      .map(c => Object.assign({}, c, {tel: telefones[c.paciente_id] || ''}));
    el('convQtd').textContent = fila.length ? fila.length + ' esperando' : 'fila vazia';
    bloco('convLista', htmlConversas(fila));
    const badge = el('badgeConv');
    badge.textContent = String(fila.length);
    badge.classList.toggle('some', !fila.length);
  }

  async function carregarLicenca(){
    try{
      mostrarLicenca(await api('/api/licenca', {semToken:true}));
    }catch(_){ mostrarLicenca(null); }
  }

  async function carregar(tela){
    if(!token() || ocupado) return;
    ocupado = true;
    el('btnAtualizar').disabled = true;
    el('btnAtualizar').textContent = 'Atualizando…';
    const dia = isoDia(0);
    try{
      await carregarLicenca();
      if(tela === 'pendencias'){
        try{ await carregarPendencias(); }catch(erro){ blocoErro('pendLista', erro); }
      }else if(tela === 'conversas'){
        try{ await carregarConversas(); }catch(erro){ blocoErro('convLista', erro); }
      }else{
        try{ await carregarHoje(dia); }catch(erro){ blocoErro('caixaMoedas', erro); bloco('recebidoDia',''); }
        try{ await carregarAgenda(dia); }catch(erro){ blocoErro('agendaLista', erro); }
      }
      trocado[tela || 'hoje'] = true;
    }catch(erro){
      if(erro && erro.rede) avisoRede('Sem conexão com o servidor da clínica.');
    }finally{
      ocupado = false;
      el('btnAtualizar').disabled = false;
      el('btnAtualizar').textContent = 'Atualizar';
    }
  }

  /* ============================================================
     LIGAÇÕES
     ============================================================ */
  el('formLogin').addEventListener('submit', async ev => {
    ev.preventDefault();
    const login = el('loginUser').value.trim();
    const senha = el('loginSenha').value;
    if(!login || !senha){ el('loginAviso').textContent = 'Preencha usuário e senha.'; return; }
    el('btnLogin').disabled = true;
    el('btnLogin').textContent = 'Entrando…';
    try{
      const dados = await api('/api/login', {metodo:'POST', semToken:true, corpo:{login:login, senha:senha}});
      guardarToken(dados.token, dados.usuario || login);
      trocado = {};
      entrarNaTela(dados.usuario || login);
      await carregar('hoje');
    }catch(erro){
      el('loginAviso').textContent = erro && erro.message ? erro.message : 'não deu para entrar';
      el('btnLogin').disabled = false;
      el('btnLogin').textContent = 'Entrar';
    }
  });

  el('btnAtualizar').addEventListener('click', () => {
    const ativa = document.querySelector('.tela.ativa');
    const nome = ativa ? ativa.id.replace('tela-','') : 'hoje';
    trocado[nome] = false;
    carregar(nome);
  });

  el('btnSair').addEventListener('click', async () => {
    try{ await api('/api/logout', {metodo:'POST'}); }catch(_){ }
    pedirLogin('');
  });

  document.querySelectorAll('#abas button').forEach(b => {
    b.addEventListener('click', () => trocarTela(b.dataset.tela));
  });

  // volta do bolso: se ficou mais de um minuto fora, atualiza o que está na tela
  let escondidoEm = 0;
  document.addEventListener('visibilitychange', () => {
    if(document.hidden){ escondidoEm = Date.now(); return; }
    if(token() && escondidoEm && Date.now() - escondidoEm > 60000){
      const ativa = document.querySelector('.tela.ativa');
      carregar(ativa ? ativa.id.replace('tela-','') : 'hoje');
    }
  });

  (async function abrir(){
    await carregarLicenca().catch(() => {});
    if(!token()){ pedirLogin(''); return; }
    entrarNaTela(usuarioDaSessao());
    await carregar('hoje');
  })();
</script>
</body>
</html>
